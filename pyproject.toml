[project]
name = "planetastic"
version = "2.1.0"
description = "An ADSB to Meshtastic Connector"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "James Rich", email = "james.a.rich@gmail.com"}
]
dependencies = [
    "meshtastic",
    "mudp",
    "PyYAML",
    "aiosqlite",
    "aiohttp",
]

[project.scripts]
planetastic = "planetastic:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
